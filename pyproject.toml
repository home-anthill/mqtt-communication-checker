[tool.poetry]
name = "mqtt-communication-checker"
version = "2.0.0"
description = "Local MQTT communication checker"
authors = ["Stefano Cappa"]
readme = "README.md"
packages = [
    {include = "src"}
]

[tool.poetry.scripts]
mqtt-communication-checker = "src.__main__:main"

[tool.poetry.dependencies]
python = "^3.12"
paho-mqtt = "^2.1.0"
pymongo = "4.19.0"
redis = "^8.1.0"
cryptography = "==50.0.2"
pydantic = "==2.14.1"
questionary = "^2.1.1"
pyrefly = "==1.4.0"

[tool.poetry.group.dev.dependencies]
pyrefly = "^1.2.0"

[tool.pyrefly]
project-includes = [
    "**/*.py*",
]
check-unannotated-defs = true
infer-return-types = "checked"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
